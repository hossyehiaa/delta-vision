name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit (geo / auth / i18n) + build
    # ubuntu-latest is 26.04, which playwright 1.57 (the version the E2E suites are
    # written against) does not support yet; stay on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python3 build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: geo suite (140 checks, vs pyproj reference)
        env:
          PROJ4_PATH: ${{ github.workspace }}/vendor/proj4/proj4.js
        run: node test/geo.test.js src/geo.js test/fixtures ref/bourj_reference.json test/fixtures/bourj
      - name: auth suite (39 checks)
        run: node test/auth.test.js src/auth.js
      - name: i18n suite (87 checks)
        run: node test/i18n.test.js src/i18n.js src/data.js
      - name: install deps + playwright
        run: |
          # playwright must be a real dependency so the tests can require() it;
          # then its own CLI downloads the matching chromium. esbuild +
          # @google/earthengine compile the GEE engine bundle the api/ layer needs.
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: build GEE engine bundle (api/_gee_engine.js)
        run: bash scripts/build_gee.sh
      - name: live-backend E2E (12 checks)
        run: node test/live.test.js public/index.html test/fixtures test/fixtures/bourj
      - name: server-auth E2E (15 checks)
        run: node test/server_auth.test.js public/index.html test/fixtures
      - name: GEE unit + live-mode E2E (59 checks)
        run: |
          node test/gee_unit.test.js
          node test/live_gee.test.js public/index.html
      - name: preview E2E (54 checks)
        run: node test/e2e.js public/index.html test/fixtures test/fixtures/bourj shots
